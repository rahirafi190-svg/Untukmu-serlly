<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing page Rizki</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.js">
    <link rel="stylesheet" href="Game.js">
    <style>
        /* Gaya dasar halaman */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1; /* Pink muda */
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* Animasi Boneka Sederhana (Beruang) */
        .teddy {
            width: 150px;
            height: 150px;
            background: #8b4513; /* Warna cokelat boneka */
            border-radius: 50% 50% 40% 40%;
            position: relative;
            margin: 0 auto 20px;
            animation: bounce 1.5s infinite alternate; /* Animasi melompat lucu */
        }

        /* Telinga */
        .teddy::before, .teddy::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: #8b4513;
            border-radius: 50%;
            top: -10px;
        }
        .teddy::before { left: 10px; }
        .teddy::after { right: 10px; }

        /* Mata */
        .eye {
            width: 15px;
            height: 15px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 50px;
        }
        .eye.left { left: 40px; }
        .eye.right { right: 40px; }

        /* Mulut/Hidung */
        .nose {
            width: 20px;
            height: 15px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Pesan Teks */
        .message {
            font-size: 1.5rem;
            color: #d81b60;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        /* Tombol Interaktif */
        .buttons button {
            padding: 10px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin: 0 10px;
            transition: 0.3s;
        }

        .btn-yes { background-color: #4caf50; color: white; }
        .btn-no { background-color: #f44336; color: white; position: relative; }

        /* Keyframes Animasi */
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
  <div class="container">
        <!-- Visual Boneka -->
        <div class="teddy">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="nose"></div>
        </div>
        <h1>Serlly is rodiyah</h1>
        <!-- Kalimat Utama -->
        <div class="message" id="msg">Hai kamu... <br> Kita balikan, yuk? 🥺 Aku minta maaf banget sama kamuudah bikin kamu kecewa </div>

        <div class="buttons">
            <button class="btn-yes" onclick="terima()">Mau!</button>
            <button class="btn-no" id="noBtn" onmouseover="kabur()">Nggak</button>
        </div>
    </div>

    <script>
        window.onload = () => {
            document.getElementById('msg').style.opacity = '1';
        };

        function terima() {
            document.getElementById('msg').innerHTML = "Yeeayy! ❤️ <br> I promise to be better this time!";
            document.querySelector('.buttons').style.display = 'none';
        }

        // Fungsi iseng: Tombol "Nggak" akan lari saat didekati
    function kabur() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.js">
    <link rel="stylesheet" href="Game.js">
</body>

</html>
